name: Deploy Innovatech Frontend

on:
  push:
    branches:
      - deploy 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest

  deploy-to-ec2:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue remoto en AWS EC2 vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_FRONT }}     
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}      
          script: |
            echo "Conectado a la EC2 del Frontend. Actualizando..."
            cd /home/ubuntu/Innovatech-frontend1 || mkdir -p /home/ubuntu/Innovatech-frontend1 && cd /home/ubuntu/Innovatech-frontend1
            git pull origin deploy || true
            docker compose down
            docker system prune -f
            docker compose pull
            docker compose up -d --build
            echo "¡Frontend de Innovatech actualizado en producción!"